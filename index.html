<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adrielle Leão</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: #544474; /* cor sólida inspirada no logo */
      color: #fff;
      text-align: center;
    }

    header {
      padding: 30px 20px 10px;
    }

    header img {
      max-width: 120px;
    }

    h1 {
      font-size: 1.8em;
      margin: 15px 0 5px;
    }

    p {
      font-size: 1em;
      opacity: 0.8;
      margin-bottom: 30px;
    }

    .btn {
      display: block;
      margin: 15px auto;
      padding: 15px;
      width: 85%;
      border: none;
      border-radius: 12px;
      background: #fff;
      color: #3b0ca1;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .btn:hover {
      transform: scale(1.05);
      background: #f4ecff;
    }

    /* Popup */
    .popup {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px; /* margem em volta */
      box-sizing: border-box;
    }

    .popup-content {
      background: #fff;
      color: #333;
      padding: 20px;
      border-radius: 15px;
      width: 100%;
      max-width: 400px;
      text-align: left;
      animation: fadeIn 0.3s ease-in-out;
    }

    .popup-content h2 {
      margin-top: 0;
      color: #3b0ca1;
    }

    .popup-content img {
      width: 100%;
      border-radius: 10px;
      margin: 10px 0;
    }

    .popup .btn {
      background: #3b0ca1;
      color: #fff;
    }

    .close {
      float: right;
      font-size: 1.4em;
      cursor: pointer;
      color: #3b0ca1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <header>
    <img src="src/logo.png" alt="Logo Adrielle Leão">
    <h1>Adrielle Leão</h1>
  </header>

  <main>
    <!-- Aqui você pode repetir os botões que existem no beacons -->
    <button class="btn" onclick="openPopup()">Nosso grupo no WhatsApp</button>
    <a href="https://youtube.com/@adrielleleaoo" target="_blank"><button class="btn">YouTube</button></a>
    <a href="https://www.instagram.com/adrielle.leaoo" target="_blank"><button class="btn">Instagram</button></a>
    <a href="https://www.tiktok.com/coin" target="_blank"><button class="btn">Diamantes com 25% OFF</button></a>
    <!-- adicione mais botões conforme precisar -->
  </main>

  <!-- POPUP -->
  <div class="popup" id="popup">
    <div class="popup-content">
      <span class="close" onclick="closePopup()">&times;</span>
      <h2>Como entrar no grupo</h2>
      <p>O link de convite não funciona no navegador do TikTok. Para entrar no grupo, siga o passo a passo abaixo.</p>

      <p><b>1.</b> Toque em três pontinhos na parte superior:</p>
      <img src="src/passo1.png" alt="Passo 1">

      <p><b>2.</b> Depois toque em <b>Abrir no navegador</b>:</p>
      <img src="src/passo2.png" alt="Passo 2">

      <button class="btn" id="grupo" onclick="continuar()">Entrar no grupo</button>
    </div>
  </div>

  <script>
    function openPopup() {
      document.getElementById('popup').style.display = 'flex';
      location.hash = "popup";
      //history.replaceState(null, '', '?popup=true');
      //document.getElementById('grupo').style.display ='none'
      console.log(document.getElementById('grupo').style.display);
      if(estaNoTikTok()){
          document.getElementById('grupo').style.display = 'none';
      }
    }

    function closePopup() {
      document.getElementById('popup').style.display = 'none';
      history.replaceState(null, '', window.location.pathname);
    }

    function continuar() {
      // Aqui vai o link do grupo
      window.open("https://chat.whatsapp.com/D2tpEFLtGcL91WWT6eDC2N", "_blank");
    }
    function estaNoTikTok() {
    const ua = navigator.userAgent || navigator.vendor || window.opera;
    // Verifica se o user agent contém "TikTok"
    return /TikTok/i.test(ua);
  }
    window.addEventListener('load', () => {
    const params = new URLSearchParams(window.location.search);
    if (location.hash === "#popup") {
      openPopup();
    }
  });
  </script>

</body>
</html>
